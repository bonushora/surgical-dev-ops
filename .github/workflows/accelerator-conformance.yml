name: Accelerator Conformance

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  accelerator-conformance:
    name: Canonical Accelerator Conformance — ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Show native execution identity
        run: node -e "console.log(JSON.stringify({ platform: process.platform, arch: process.arch, node: process.version }))"

      - name: Run canonical conformance suite
        run: npm test
