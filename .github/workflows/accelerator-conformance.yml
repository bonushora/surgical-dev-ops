name: Accelerator Conformance

on:
  push:
    branches:
      - main
      - feature/control-plane-commercial-beta-gate-v1
      - feature/customer-operable-runtime-v1
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      qualification_ref:
        description: Explicit Git ref or commit SHA to qualify
        required: true
        type: string

permissions:
  contents: read

jobs:
  accelerator-conformance:
    name: Canonical Accelerator Conformance — ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-15

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.qualification_ref || github.ref }}

      - name: Verify exact requested qualification identity
        if: github.event_name == 'workflow_dispatch'
        id: exact_ref
        shell: bash
        env:
          QUALIFICATION_REF: ${{ inputs.qualification_ref }}
        run: |
          set -euo pipefail
          test -n "$QUALIFICATION_REF"
          case "$QUALIFICATION_REF" in
            -*|*" "*|*$'\t'*|*$'\n'*)
              echo "qualification_ref is malformed or ambiguous" >&2
              exit 1
              ;;
          esac
          resolved_sha="$(git rev-parse --verify --end-of-options "${QUALIFICATION_REF}^{commit}")"
          checked_out_sha="$(git rev-parse --verify HEAD^{commit})"
          test "$resolved_sha" = "$checked_out_sha"
          test -n "$resolved_sha"
          echo "resolved_sha=$resolved_sha" >> "$GITHUB_OUTPUT"
          echo "checked_out_sha=$checked_out_sha" >> "$GITHUB_OUTPUT"
          echo "Qualified exact commit: $resolved_sha"

      - name: Materialize deterministic exact-ref branch identity
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        env:
          RESOLVED_SHA: ${{ steps.exact_ref.outputs.resolved_sha }}
        run: |
          set -euo pipefail
          qualification_branch="qualification/exact-ref/${RESOLVED_SHA:0:12}"
          git switch -c "$qualification_branch"
          test "$(git branch --show-current)" = "$qualification_branch"
          test "$(git rev-parse --verify HEAD^{commit})" = "$RESOLVED_SHA"

      - name: Materialize deterministic pull-request merge branch
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          git switch -c sdo-ci-pr-merge
          test "$(git branch --show-current)" = "sdo-ci-pr-merge"

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24.18.0'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Show native execution identity
        run: |
          node -e "console.log(JSON.stringify({ platform: process.platform, arch: process.arch, node: process.version }))"

      - name: Symbolize Windows Node startup abort
        if: matrix.os == 'windows-latest' && github.event_name == 'workflow_dispatch'
        shell: pwsh
        run: tests/accelerator/fixtures/symbolize-windows-node-startup.ps1

      - name: Install and attest qualified Linux Bubblewrap
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update \
            -o Dir::Etc::sourcelist="sources.list.d/ubuntu.sources" \
            -o Dir::Etc::sourceparts="-" \
            -o APT::Get::List-Cleanup="0"
          sudo apt-get install --yes --no-install-recommends \
            apparmor-profiles apparmor-utils bubblewrap
          sudo install -m 0644 \
            /usr/share/apparmor/extra-profiles/bwrap-userns-restrict \
            /etc/apparmor.d/bwrap-userns-restrict
          sudo apparmor_parser -r /etc/apparmor.d/bwrap-userns-restrict
          bwrap_path="$(command -v bwrap)"
          test "$bwrap_path" = "/usr/bin/bwrap"
          test -x "$bwrap_path"
          "$bwrap_path" --version
          "$bwrap_path" --unshare-user --uid 0 --gid 0 \
            --unshare-pid --unshare-net \
            --unshare-ipc --unshare-uts --new-session --die-with-parent \
            --dir /usr --ro-bind /usr /usr --symlink usr/lib /lib \
            --symlink usr/lib64 /lib64 --proc /proc --dev /dev /usr/bin/true

      - name: Build qualified Linux Codex provider relay
        if: matrix.os == 'ubuntu-latest'
        run: node accelerator/native/linux/build-codex-network-relay.js

      - name: Build qualified Windows native durability helper
        if: matrix.os == 'windows-latest'
        shell: cmd
        run: accelerator\native\windows\build-helper.cmd

      - name: Build Windows Node startup diagnostic
        if: matrix.os == 'windows-latest' && github.event_name == 'workflow_dispatch'
        shell: cmd
        run: tests\accelerator\fixtures\build-windows-appcontainer-environment-diagnostic.cmd

      - name: Observe Windows Node startup boundary
        if: matrix.os == 'windows-latest' && github.event_name == 'workflow_dispatch'
        run: node tests/accelerator/fixtures/run-windows-node-startup-diagnostic.js

      - name: Build qualified macOS native Seatbelt helper
        if: matrix.os == 'macos-15'
        run: sh accelerator/native/macos/build-helper.sh

      - name: Run canonical conformance suite
        id: conformance
        shell: bash
        continue-on-error: true
        run: |
          set +e
          npm test > native-test.log 2>&1
          canonical_test_exit_code=$?
          echo "exit_code=$canonical_test_exit_code" >> "$GITHUB_OUTPUT"
          exit "$canonical_test_exit_code"

      - name: Inspect customer package contents
        if: steps.conformance.outcome == 'success'
        shell: bash
        run: npm pack --dry-run --json > customer-pack-dry-run.json

      - name: Build customer artifact and supply-chain inventory
        if: steps.conformance.outcome == 'success'
        shell: bash
        run: |
          npm pack --json > customer-pack.json
          node accelerator/ci/customer-supply-chain.js > customer-supply-chain.json
          node -e "const fs=require('fs');const path=require('path');const p=JSON.parse(fs.readFileSync('customer-pack.json','utf8'))[0].filename;fs.renameSync(p,'surgical-customer-runtime.tgz');console.log(path.resolve('surgical-customer-runtime.tgz'));"
          node accelerator/ci/customer-artifact-manifest.js "$(node -e "console.log(require('path').resolve('surgical-customer-runtime.tgz'))")" > customer-artifact-manifest.json

      - name: Exercise installed customer artifact
        if: steps.conformance.outcome == 'success'
        shell: bash
        run: |
          install_root="$(node -e "console.log(require('fs').mkdtempSync(require('path').join(require('os').tmpdir(),'surgical-artifact-install-')))")"
          npm install --ignore-scripts --omit=optional --no-audit --no-fund --offline --package-lock=false --prefix "$install_root" ./surgical-customer-runtime.tgz
          if [ "$RUNNER_OS" = "Windows" ]; then
            installed_cli="$install_root/node_modules/surgical-dev-ops/accelerator/cli/surgical.js"
          else
            installed_cli="$install_root/node_modules/surgical-dev-ops/accelerator/cli/surgical.js"
          fi
          SURGICAL_INSTALLED_CLI="$installed_cli" \
          SURGICAL_INSTALLED_PACKAGE_ROOT="$install_root/node_modules/surgical-dev-ops" \
          node accelerator/ci/customer-product-acceptance.js > customer-product-acceptance.json
          node -e "require('fs').rmSync(process.argv[1],{recursive:true,force:true})" "$install_root"

      - name: Retain customer product evidence
        if: always() && steps.conformance.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: customer-product-${{ matrix.os }}-${{ github.run_id }}-${{ github.event_name == 'workflow_dispatch' && steps.exact_ref.outputs.resolved_sha || github.sha }}
          path: |
            surgical-customer-runtime.tgz
            customer-artifact-manifest.json
            customer-pack-dry-run.json
            customer-supply-chain.json
            customer-product-acceptance.json
          if-no-files-found: error
          retention-days: 30

      - name: Observe targeted P.3 native contract
        if: always()
        continue-on-error: true
        run: node --test --test-reporter=spec tests/accelerator/mutation-journal-physical-root-platform.test.js

      - name: Observe Windows native primitives
        if: always() && matrix.os == 'windows-latest'
        continue-on-error: true
        run: node --test --test-reporter=spec tests/accelerator/windows-native-primitives-diagnostic.test.js

      - name: Compare Windows AppContainer environment contracts
        if: always() && matrix.os == 'windows-latest' && github.event_name == 'workflow_dispatch'
        continue-on-error: true
        shell: cmd
        run: |
          call tests\accelerator\fixtures\build-windows-appcontainer-environment-diagnostic.cmd
          if errorlevel 1 exit /b 1
          tests\accelerator\fixtures\windows-appcontainer-environment-diagnostic.exe
          set "DIAGNOSTIC_STATUS=%ERRORLEVEL%"
          del /q tests\accelerator\fixtures\windows-appcontainer-environment-diagnostic.exe
          exit /b %DIAGNOSTIC_STATUS%

      - name: Observe macOS Node abort boundary
        if: steps.conformance.outcome == 'failure' && matrix.os == 'macos-15' && github.event_name == 'workflow_dispatch'
        continue-on-error: true
        run: node tests/accelerator/fixtures/report-macos-node-abort.js

      - name: Emit native failure diagnostics
        if: steps.conformance.outcome == 'failure'
        run: |
          node -e "const fs=require('fs'); const log=fs.readFileSync('native-test.log','utf8'); console.log(log); const lines=log.split(/\r?\n/); const selected=lines.filter((line)=>/✖|not ok|AssertionError|ERR_ASSERTION|UNSUPPORTED|unsafe or ambiguous|O_NOFOLLOW|ENOENT|EINVAL|EPERM|EACCES|workspace mismatch|canonical|durability|journal|lock|SDO_WINDOWS_NATIVE_PROBE/i.test(line)); const diagnostic=(selected.length?selected.slice(-140):lines.slice(-140)).join(' | '); const escaped=diagnostic.replace(/%/g,'%25').replace(/\r/g,'%0D').replace(/\n/g,'%0A'); console.log('::error title=Native conformance diagnostics::'+escaped);"

      - name: Produce machine-readable qualification evidence
        if: always()
        env:
          CANONICAL_TEST_EXIT_CODE: ${{ steps.conformance.outputs.exit_code }}
          REQUESTED_QUALIFICATION_REF: ${{ github.event_name == 'workflow_dispatch' && inputs.qualification_ref || '' }}
          EXPECTED_TARGET_SHA: ${{ github.event_name == 'workflow_dispatch' && steps.exact_ref.outputs.resolved_sha || github.sha }}
          CHECKED_OUT_SHA: ${{ github.event_name == 'workflow_dispatch' && steps.exact_ref.outputs.checked_out_sha || github.sha }}
          GITHUB_SHA: ${{ github.sha }}
        run: node accelerator/ci/qualification-evidence.js

      - name: Retain machine-readable qualification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qualification-evidence-${{ matrix.os }}-${{ github.run_id }}-${{ github.event_name == 'workflow_dispatch' && steps.exact_ref.outputs.resolved_sha || github.sha }}
          path: qualification-evidence.json
          if-no-files-found: error
          retention-days: 30

      - name: Enforce canonical conformance result
        if: steps.conformance.outcome == 'failure'
        run: node -e "process.exit(1)"

  publish-npm:
    name: Publish qualified npm package
    if: github.event_name != 'workflow_dispatch' && startsWith(github.ref, 'refs/tags/v')
    needs:
      - accelerator-conformance
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout exact qualified tag
        uses: actions/checkout@v6

      - name: Setup qualified Node.js and npm registry
        uses: actions/setup-node@v6
        with:
          node-version: '24.18.0'
          registry-url: 'https://registry.npmjs.org'
          cache: npm

      - name: Verify immutable tag and package identity
        shell: bash
        run: |
          test "v$(node -p "require('./package.json').version")" = "${GITHUB_REF_NAME}"
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          test -z "$(git status --porcelain)"

      - name: Install exact dependencies
        run: npm ci

      - name: Verify package contents
        run: npm pack --dry-run --json

      - name: Publish only after the complete native matrix
        run: npm publish --access public --provenance --tag next
