name: ADR-038 Exact Frozen SHA Qualification

on:
  push:
    branches:
      - review/adr038-exact-sha-ci
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-sha-conformance:
    name: Exact Frozen SHA Conformance — ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout exact frozen review SHA
        uses: actions/checkout@v6
        with:
          ref: 767bae5cee6824494db500f804c3328570f1c1dc
          fetch-depth: 1

      - name: Verify exact checkout identity
        shell: bash
        run: |
          set -u
          EXPECTED="767bae5cee6824494db500f804c3328570f1c1dc"
          ACTUAL="$(git rev-parse HEAD)"
          echo "EXPECTED_REVIEW_SHA=$EXPECTED"
          echo "ACTUAL_CHECKOUT_SHA=$ACTUAL"
          test "$ACTUAL" = "$EXPECTED"

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24.18.0'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Show native execution identity
        run: |
          node -e "console.log(JSON.stringify({ platform: process.platform, arch: process.arch, node: process.version }))"

      - name: Build qualified Windows native durability helper
        if: matrix.os == 'windows-latest'
        shell: cmd
        run: accelerator\native\windows\build-helper.cmd

      - name: Build qualified macOS native Seatbelt helper
        if: matrix.os == 'macos-latest'
        run: sh accelerator/native/macos/build-helper.sh

      - name: Run canonical conformance suite
        run: npm test

      - name: Verify exact checkout identity after qualification
        if: always()
        shell: bash
        run: |
          set -u
          EXPECTED="767bae5cee6824494db500f804c3328570f1c1dc"
          ACTUAL="$(git rev-parse HEAD)"
          echo "EXPECTED_REVIEW_SHA=$EXPECTED"
          echo "FINAL_CHECKOUT_SHA=$ACTUAL"
          test "$ACTUAL" = "$EXPECTED"
