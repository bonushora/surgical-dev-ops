name: Accelerator Conformance

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      qualification_ref:
        description: Explicit Git ref or commit SHA to qualify
        required: true
        type: string

permissions:
  contents: read

jobs:
  accelerator-conformance:
    name: Canonical Accelerator Conformance — ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.qualification_ref || github.ref }}

      - name: Verify exact requested qualification identity
        if: github.event_name == 'workflow_dispatch'
        id: exact_ref
        shell: bash
        env:
          QUALIFICATION_REF: ${{ inputs.qualification_ref }}
        run: |
          set -euo pipefail
          test -n "$QUALIFICATION_REF"
          case "$QUALIFICATION_REF" in
            -*|*" "*|*$'\t'*|*$'\n'*)
              echo "qualification_ref is malformed or ambiguous" >&2
              exit 1
              ;;
          esac
          resolved_sha="$(git rev-parse --verify --end-of-options "${QUALIFICATION_REF}^{commit}")"
          checked_out_sha="$(git rev-parse --verify HEAD^{commit})"
          test "$resolved_sha" = "$checked_out_sha"
          test -n "$resolved_sha"
          echo "resolved_sha=$resolved_sha" >> "$GITHUB_OUTPUT"
          echo "Qualified exact commit: $resolved_sha"

      - name: Materialize deterministic exact-ref branch identity
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        env:
          RESOLVED_SHA: ${{ steps.exact_ref.outputs.resolved_sha }}
        run: |
          set -euo pipefail
          qualification_branch="qualification/exact-ref/${RESOLVED_SHA:0:12}"
          git switch -c "$qualification_branch"
          test "$(git branch --show-current)" = "$qualification_branch"
          test "$(git rev-parse --verify HEAD^{commit})" = "$RESOLVED_SHA"

      - name: Materialize deterministic pull-request merge branch
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          git switch -c sdo-ci-pr-merge
          test "$(git branch --show-current)" = "sdo-ci-pr-merge"

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24.18.0'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Show native execution identity
        run: |
          node -e "console.log(JSON.stringify({ platform: process.platform, arch: process.arch, node: process.version }))"

      - name: Build qualified Windows native durability helper
        if: matrix.os == 'windows-latest'
        shell: cmd
        run: accelerator\native\windows\build-helper.cmd

      - name: Build qualified macOS native Seatbelt helper
        if: matrix.os == 'macos-latest'
        run: sh accelerator/native/macos/build-helper.sh

      - name: Run canonical conformance suite
        id: conformance
        continue-on-error: true
        run: npm test > native-test.log 2>&1

      - name: Observe targeted P.3 native contract
        if: always()
        continue-on-error: true
        run: node --test --test-reporter=spec tests/accelerator/mutation-journal-physical-root-platform.test.js

      - name: Observe Windows native primitives
        if: always() && matrix.os == 'windows-latest'
        continue-on-error: true
        run: node --test --test-reporter=spec tests/accelerator/windows-native-primitives-diagnostic.test.js

      - name: Emit native failure diagnostics
        if: steps.conformance.outcome == 'failure'
        run: |
          node -e "const fs=require('fs'); const log=fs.readFileSync('native-test.log','utf8'); console.log(log); const lines=log.split(/\r?\n/); const selected=lines.filter((line)=>/✖|not ok|AssertionError|ERR_ASSERTION|UNSUPPORTED|unsafe or ambiguous|O_NOFOLLOW|ENOENT|EINVAL|EPERM|EACCES|workspace mismatch|canonical|durability|journal|lock|SDO_WINDOWS_NATIVE_PROBE/i.test(line)); const diagnostic=(selected.length?selected.slice(-140):lines.slice(-140)).join(' | '); const escaped=diagnostic.replace(/%/g,'%25').replace(/\r/g,'%0D').replace(/\n/g,'%0A'); console.log('::error title=Native conformance diagnostics::'+escaped);"

      - name: Enforce canonical conformance result
        if: steps.conformance.outcome == 'failure'
        run: node -e "process.exit(1)"

  publish-npm:
    name: Publish qualified npm package
    if: github.event_name != 'workflow_dispatch' && startsWith(github.ref, 'refs/tags/v')
    needs:
      - accelerator-conformance
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout exact qualified tag
        uses: actions/checkout@v6

      - name: Setup qualified Node.js and npm registry
        uses: actions/setup-node@v6
        with:
          node-version: '24.18.0'
          registry-url: 'https://registry.npmjs.org'
          cache: npm

      - name: Verify immutable tag and package identity
        shell: bash
        run: |
          test "v$(node -p "require('./package.json').version")" = "${GITHUB_REF_NAME}"
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          test -z "$(git status --porcelain)"

      - name: Install exact dependencies
        run: npm ci

      - name: Verify package contents
        run: npm pack --dry-run --json

      - name: Publish only after the complete native matrix
        run: npm publish --access public --provenance --tag next
